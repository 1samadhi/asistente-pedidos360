<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620"
     font-family="Helvetica, Arial, sans-serif">
<defs><marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
  orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6672"/></marker></defs>
<rect width="1000" height="620" fill="#ffffff"/>
<text x="40" y="34" font-size="16" font-weight="700" fill="#1b2430">Boceto · secuencia de una consulta mixta</text>
<text x="40" y="50" font-size="10.5" fill="#5b6672">Cómo el agente resuelve una pregunta que necesita documentación Y estado actual del sistema</text>
<rect x="12" y="62" width="156" height="34" rx="4" fill="#ffffff" stroke="#1b2430" stroke-width="1.6"/>
<text x="90" y="84" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1b2430">Desarrollador</text>
<line x1="90" y1="96" x2="90" y2="566" stroke="#c9d0cc" stroke-width="1.2" stroke-dasharray="3 4"/>
<rect x="190" y="62" width="156" height="34" rx="4" fill="#ffffff" stroke="#1b2430" stroke-width="1.6"/>
<text x="268" y="84" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1b2430">Agente</text>
<line x1="268" y1="96" x2="268" y2="566" stroke="#c9d0cc" stroke-width="1.2" stroke-dasharray="3 4"/>
<rect x="374" y="62" width="156" height="34" rx="4" fill="#ffffff" stroke="#1b2430" stroke-width="1.6"/>
<text x="452" y="84" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1b2430">Recuperación</text>
<line x1="452" y1="96" x2="452" y2="566" stroke="#c9d0cc" stroke-width="1.2" stroke-dasharray="3 4"/>
<rect x="570" y="62" width="156" height="34" rx="4" fill="#ffffff" stroke="#1b2430" stroke-width="1.6" stroke-dasharray="5 3"/>
<text x="648" y="84" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1b2430">API Pedidos360</text>
<line x1="648" y1="96" x2="648" y2="566" stroke="#c9d0cc" stroke-width="1.2" stroke-dasharray="3 4"/>
<rect x="778" y="62" width="156" height="34" rx="4" fill="#ffffff" stroke="#1b2430" stroke-width="1.6"/>
<text x="856" y="84" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1b2430">Guardrails</text>
<line x1="856" y1="96" x2="856" y2="566" stroke="#c9d0cc" stroke-width="1.2" stroke-dasharray="3 4"/>
<rect x="262" y="128" width="12" height="412" fill="#eef2f0" stroke="#1f6f63" stroke-width="1"/>
<line x1="90" y1="140" x2="268" y2="140" stroke="#5b6672" stroke-width="1.5" marker-end="url(#f)"/>
<text x="179.0" y="133" text-anchor="middle" font-size="10.5" fill="#5b6672">«¿Cómo obtengo el listado por API y cuántos llevo?»</text>
<rect x="172" y="168" width="192" height="34" rx="4" fill="#fdf6ec" stroke="#b4472b" stroke-width="1.2"/>
<text x="268" y="182" text-anchor="middle" font-size="10" font-weight="600" fill="#b4472b">La pregunta tiene DOS partes</text>
<text x="268" y="195" text-anchor="middle" font-size="9.5" fill="#b4472b">el modelo decide usar dos herramientas</text>
<rect x="446" y="228" width="12" height="40" fill="#eef2f0" stroke="#1f6f63" stroke-width="1"/>
<line x1="268" y1="240" x2="452" y2="240" stroke="#5b6672" stroke-width="1.5" marker-end="url(#f)"/>
<text x="360.0" y="233" text-anchor="middle" font-size="10.5" fill="#5b6672">buscar_documentacion("listado de pedidos por API")</text>
<line x1="452" y1="262" x2="268" y2="262" stroke="#1f6f63" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#f)"/>
<text x="360.0" y="255" text-anchor="middle" font-size="10.5" fill="#1f6f63">5 fragmentos numerados [1]…[5]</text>
<text x="360.0" y="275" text-anchor="middle" font-size="9.5" fill="#8a959f">híbrida 0,8 léxico / 0,2 denso</text>
<rect x="642" y="320" width="12" height="80" fill="#eef2f0" stroke="#1f6f63" stroke-width="1"/>
<line x1="268" y1="332" x2="648" y2="332" stroke="#5b6672" stroke-width="1.5" marker-end="url(#f)"/>
<text x="458.0" y="325" text-anchor="middle" font-size="10.5" fill="#5b6672">consultar_pedidos()</text>

<text x="708" y="345" font-size="10.5" fill="#5b6672">POST /oauth2/token</text>
<text x="708" y="379" font-size="9.5" fill="#8a959f">obtiene el token de Entra ID</text>
<path d="M 654 348 L 700 348 L 700 366 L 654 366" fill="none" stroke="#5b6672" stroke-width="1.4" marker-end="url(#f)"/>
<line x1="648" y1="392" x2="268" y2="392" stroke="#1f6f63" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#f)"/>
<text x="458.0" y="385" text-anchor="middle" font-size="10.5" fill="#1f6f63">56 pedidos · rankings ya calculados</text>
<text x="458.0" y="405" text-anchor="middle" font-size="9.5" fill="#8a959f">el orden lo computa la herramienta, no el modelo</text>
<rect x="164" y="418" width="208" height="30" rx="4" fill="#f4f6f5" stroke="#c9d0cc" stroke-width="1.2"/>
<text x="268" y="437" text-anchor="middle" font-size="10" fill="#5b6672">redacta citando las fuentes documentales</text>
<rect x="850" y="468" width="12" height="40" fill="#eef2f0" stroke="#1f6f63" stroke-width="1"/>
<line x1="268" y1="480" x2="856" y2="480" stroke="#5b6672" stroke-width="1.5" marker-end="url(#f)"/>
<text x="562.0" y="473" text-anchor="middle" font-size="10.5" fill="#5b6672">respuesta redactada</text>
<line x1="856" y1="502" x2="268" y2="502" stroke="#1f6f63" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#f)"/>
<text x="562.0" y="495" text-anchor="middle" font-size="10.5" fill="#1f6f63">sin IDs, IP, tokens ni credenciales</text>
<line x1="268" y1="538" x2="90" y2="538" stroke="#1f6f63" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#f)"/>
<text x="179.0" y="531" text-anchor="middle" font-size="10.5" fill="#1f6f63">responde LAS DOS partes: cómo obtenerlo y cuántos hay</text>
<rect x="40" y="578" width="920" height="30" rx="4" fill="#ffffff" stroke="#c9d0cc" stroke-width="1"/>
<text x="56" y="598" font-size="10.5" fill="#5b6672">Este es el caso que justifica un agente y no un RAG plano: ninguna de las dos herramientas por separado responde la pregunta completa.</text>
</svg>